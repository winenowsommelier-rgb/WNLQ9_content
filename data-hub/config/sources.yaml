# Content Hub Sources Registry
# Defines all publication and data sources integrated into the collection pipeline
# Each source is configured with collection method, endpoints, authentication, and metadata
#
# Every source carries:
#   * vertical  -- one of: wine, spirits, food, lifestyle, travel, hospitality
#                  (plus legacy tags: social, thai). The pipeline only builds a
#                  collector when the source's vertical is in
#                  collection_config.enabled_verticals (see bottom of file).
#   * enabled   -- true/false. A source with enabled:false is always skipped.
#
# Last Updated: 2026-06-04
# Version: 2.2 (fixed Whisky Advocate to web_scrape; added SWA entry; updated Difford's/Wongnai
#               to playwright; added Wine Spectator + James Suckling as playwright entries;
#               carried forward v2.1 fixes: Wine Enthusiast domain, Khaosod English, QSR disables)

sources:
  wine:
    - name: "Wine Spectator"
      url: "https://www.winespectator.com"
      api_type: "playwright"
      scrape_endpoint: "https://www.winespectator.com/dailypicks"
      vertical: "wine"
      enabled: false
      disabled_reason: "RSS dead (404). Homepage and /dailypicks confirmed server-rendered with real article content (tested 2026-06-04). However no explicit CSS class names are decorated on article card wrapper elements — the site uses a custom proprietary CMS with minimal class decoration. Selectors below are best-guess from page structure patterns; needs PlaywrightCollector + DevTools selector verification before enabling."
      selectors:
        article: "article, .article-card, .review-card, div[class*='card'], li[class*='article']"
        title: "h3, h2, h3 a, h2 a, .article-title, [class*='title']"
        link: "a[href*='/articles/'], a[href*='/wine/wine-detail/']"
        excerpt: "p, .description, [class*='excerpt'], [class*='summary']"
      scrape_selector_confidence: "best-guess — proprietary CMS with minimal CSS class decoration; verified page is accessible and serves real HTML but class names not extractable via WebFetch"
      categories: ["reviews", "news", "ratings"]
      language: "en"
      update_frequency: "daily"
      auth_required: false
      content_types: ["review", "news"]
      coverage: ["wine"]
      regions: ["France", "Italy", "Spain", "USA (California)", "USA (Other)", "Argentina", "Chile", "Australia", "New Zealand", "Germany", "Portugal", "Greece", "South Africa", "Emerging"]
      notes: "Leading wine rating and review source. RSS dead (reviews.xml → 404). Homepage and /dailypicks confirmed accessible with static HTML article content. Playwright — activate once PlaywrightCollector deployed and selectors verified in DevTools."

