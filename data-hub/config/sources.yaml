      scrape_selector: ".wine-review-item"
      vertical: "wine"
      enabled: false
      disabled_reason: "no full scrape selectors + paywalled — needs scrape impl"
      categories: ["reviews", "ratings"]
      language: "en"
      update_frequency: "weekly"
      auth_required: false
      content_types: ["review"]
      coverage: ["wine"]
      regions: ["France", "Italy", "Spain", "USA (California)", "Argentina", "Chile", "Australia"]
      notes: "Premium wine ratings by Parker's team; requires web scraping of tasting notes pages."

