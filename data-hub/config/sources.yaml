# Content Hub Sources Registry
# Defines all publication and data sources integrated into the collection pipeline
# Each source is configured with collection method, endpoints, authentication, and metadata
#
# Every source carries:
#   * vertical  -- one of: wine, spirits, food, lifestyle, travel, hospitality
#                  (plus legacy tags: social, thai). The pipeline only builds a
#                  collector when the source's vertical is in
#                  collection_config.enabled_verticals (see bottom of file).
#   * enabled   -- true/false. A source with enabled:false is always skipped.
#
# Last Updated: 2026-06-02
# Version: 2.0 (6 selectable content verticals)

sources:
  wine:
