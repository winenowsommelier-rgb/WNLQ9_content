# Backfill-only sources (deep historical seeding via XML sitemaps).
#
# Sitemaps list EVERY article URL a site has published -- often with a
# <lastmod> date -- so they let the backfill reach YEARS back, far beyond the
# ~1 month an RSS feed exposes. These are crawled ONLY by pipeline/backfill.py;
# the daily pipeline/ingest.py deliberately skips api_type "sitemap".
# Verified live 2026-06-02.
backfill_sources:
  - name: "The Spirits Business"
    api_type: "sitemap"
    sitemap_url: "https://www.thespiritsbusiness.com/sitemap_index.xml"
    sitemap_child_pattern: "post-sitemap"
    vertical: "spirits"
    enabled: true
    language: "en"
    notes: "sitemap_index -> post-sitemap*.xml (loc + lastmod, back to 2011)."

  - name: "Punch"
    api_type: "sitemap"
    sitemap_url: "https://punchdrink.com/sitemap_index.xml"
    sitemap_child_pattern: "article-sitemap"
    vertical: "spirits"
    enabled: true
    language: "en"
    notes: "sitemap_index -> article-sitemap*.xml (loc + lastmod, 2013->2026)."

  - name: "Decanter"
    api_type: "sitemap"
    sitemap_url: "https://www.decanter.com/sitemap_index.xml"
    vertical: "wine"
    enabled: true
    language: "en"
    notes: "sitemap_index with 327 child sitemaps; default post/article child heuristic applies."

collection_config:
  # Which of the six content verticals to collect. Remove a vertical from this
  # list to stop collecting all of its sources; add one back to re-enable.
  # If this key is absent entirely, NO vertical filtering is applied (every
  # source builds) -- backward compatible.
  enabled_verticals: [wine, spirits, food, lifestyle, travel, hospitality]
  # Cap how many articles ANY single source may contribute to a backfill run
  # (newest kept). Prevents one prolific source -- e.g. a sitemap exposing
  # thousands of URLs -- from dominating the corpus. Default 800 if absent.
  max_backfill_per_source: 800
  default_update_frequency: "daily"
  default_language: "en"
  scraper_timeout_seconds: 30
  retry_attempts: 3
  retry_backoff_seconds: 60
