      vertical: "spirits"
      enabled: true
      categories: ["news", "market_analysis", "trends"]
      language: "en"
      update_frequency: "daily"
      auth_required: false
      content_types: ["news", "opinion", "research"]
      coverage: ["spirits"]
      spirits_types: ["whisky", "vodka", "gin", "rum", "tequila", "brandy"]
      regions: ["Scotland", "Ireland", "USA", "Japan", "Mexico", "France"]
      notes: "Industry news and market analysis; strong for trend signals and competitive intelligence."

    - name: "Scotch Whisky Association"
      url: "https://scotch-whisky.org.uk"
      api_type: "web_scrape"
      scrape_endpoint: "https://scotch-whisky.org.uk/newsroom/"
      vertical: "spirits"
      geo_focus: "scotland"
      enabled: true
      selectors:
        article: "a.news-article-item__holder, a.content-column-box--featured"
        title: "h2, h3, h4"
        link: "a.news-article-item__holder, a.content-column-box--featured"
        excerpt: "p"
      # Selectors verified 2026-06-04 via Playwright + requests: both return
      # 13 static article containers at scotch-whisky.org.uk/newsroom/.
      # CSS classes confirmed: news-article-item__holder (list items) +
      # content-column-box--featured (featured card). Static HTML — no Playwright needed.
      categories: ["research", "market_data", "industry_news", "regulation"]
      language: "en"
      update_frequency: "weekly"
      auth_required: false
      content_types: ["research", "news", "guide"]
      coverage: ["spirits"]
      spirits_types: ["whisky"]
      regions: ["Scotland", "UK"]
      notes: "Official Scotch industry body. Publishes trade statistics, duty/tariff commentary, and industry news. Newsroom at scotch-whisky.org.uk/newsroom/ is server-rendered static HTML. No RSS feed (Umbraco CMS). High strategic value for Scotland/whisky signal."

    - name: "Scotch Whisky Research Institute"
      url: "https://www.scotchwhiskyresearch.com"
      api_type: "web_scrape"
      scrape_endpoint: "https://www.scotchwhiskyresearch.com/research/"
      scrape_selector: ".research-article"
      vertical: "spirits"
      enabled: false
      disabled_reason: "defunct domain — site no longer resolves; no full selectors"
      categories: ["research", "market_data"]
      language: "en"
      update_frequency: "monthly"
      auth_required: false
      content_types: ["research", "guide"]
      coverage: ["spirits"]
      spirits_types: ["whisky"]
      regions: ["Scotland", "UK"]
      notes: "Research reports on Scotch whisky market, production data, and industry trends."

    - name: "Punch"
      url: "https://punchdrink.com"
      api_type: "web_scrape"
      scrape_endpoint: "https://punchdrink.com/articles/"
      scrape_selector: "article.tease"
      vertical: "spirits"
      enabled: true
      selectors:
        article: "article.tease"
        title: "h3"
        link: "a[href]"
        excerpt: "p"
      categories: ["news", "trends", "culture"]
      language: "en"
      update_frequency: "daily"
      auth_required: false
      content_types: ["news", "opinion", "guide"]
      coverage: ["spirits", "wine"]
      spirits_types: ["whisky", "gin", "rum", "vodka", "cocktails"]
      regions: ["Global"]
      notes: "Long-form drinks journalism (cocktails, spirits, wine). VERIFIED 2026-06-01: domain is punchdrink.com (singular); the /articles/ listing is server-rendered static HTML and scrapes cleanly with the selectors above (12 article.tease cards). The old punchdrinks.com RSS in the audit was the wrong domain. Cards carry no date element, so published_date falls back to collected time."

