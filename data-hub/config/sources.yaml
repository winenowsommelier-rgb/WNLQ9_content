  spirits:
    - name: "Whisky Advocate"
      url: "https://www.whiskyadvocate.com"
      api_type: "web_scrape"
      scrape_endpoint: "https://www.whiskyadvocate.com/news/"
      vertical: "spirits"
      enabled: false
      disabled_reason: "RSS dead — all feed URLs return 404 (www.whiskyadvocate.com/feed/, no-www, /news/feed/ tested 2026-06-04). Switching to web_scrape: /news/ confirmed server-rendered static HTML with real article cards (h4 > a title structure, no JS skeleton). /whiskies-spirits/ and /category/news/ both 404. Selectors are best-guess — site uses a custom CMS with minimal CSS class decoration; no explicit class names visible via WebFetch. Enable once selectors verified in browser DevTools."
      selectors:
        article: "article, .post, .entry, li[class*='post'], div[class*='article'], div[class*='post']"
        title: "h4 a, h3 a, h2 a, h4, h3"
        link: "h4 a, h3 a, h2 a, a[href^='/']"
        excerpt: "p.excerpt, .entry-summary, .post-excerpt, p"
      scrape_selector_confidence: "best-guess — /news/ serves static HTML (confirmed 2026-06-04) but site CMS has minimal class decoration; verify selectors via DevTools before enabling"
      categories: ["reviews", "news", "ratings"]
      language: "en"
      update_frequency: "daily"
      auth_required: false
      content_types: ["review", "news"]
      coverage: ["spirits"]
      spirits_types: ["whisky"]
      regions: ["Scotland", "Ireland", "USA", "Japan", "India"]
      notes: "Leading whisky publication; daily content on reviews, whisky news, distillery updates. RSS removed entirely by publisher. Listing URL /news/ serves static HTML article cards with h4 title + anchor link structure."

    - name: "Difford's Guide"
      url: "https://www.diffordsguide.com"
      api_type: "playwright"
      # /cocktails/most-viewed verified live 2026-06-04: 200 OK, JS-rendered
      # cards (not in static HTML). /spirits returns 404. Targeting cocktails
      # endpoint which is confirmed reachable. PlaywrightCollector needed.
      scrape_endpoint: "https://www.diffordsguide.com/cocktails/most-viewed"
      vertical: "spirits"
      enabled: false
      disabled_reason: "playwright — PlaywrightCollector now deployed. Selectors need live verification with rendered DOM; enable after confirming card selectors in headless browser."
      selectors:
        article: "a[href*='/cocktails/'][href!='/cocktails/'][href!='/cocktails/search'][href!='/cocktails/how-to-make']"
        title: "h3, h2, [class*='name'], [class*='title']"
        link: "a[href*='/cocktails/']"
        excerpt: "p, [class*='desc']"
      categories: ["reviews", "spirits_guide"]
      language: "en"
      update_frequency: "weekly"
      auth_required: false
      content_types: ["review", "guide"]
      coverage: ["spirits"]
      spirits_types: ["gin", "rum", "whisky", "vodka", "tequila", "brandy", "cognac"]
      regions: ["Scotland", "Ireland", "USA", "Japan", "Mexico", "France"]
      notes: "Comprehensive spirits database and reviews. Homepage confirmed server-rendered with card structure. Spirit listing endpoints return 404 on static requests — needs PlaywrightCollector for locale-aware navigation."

