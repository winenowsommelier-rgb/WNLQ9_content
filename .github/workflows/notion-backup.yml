name: Notion backup

# Weekly automated backup of the WNLQ9 content system (Notion -> git).
on:
  schedule:
    # Mondays at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fail loudly and early if the secret is missing, so a missing NOTION_TOKEN
      # surfaces as a red workflow run instead of a silent empty backup.
      - name: Verify NOTION_TOKEN is configured
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "${NOTION_TOKEN}" ]; then
            echo "::error::NOTION_TOKEN repository secret is not set. The Notion backup cannot run."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi
          echo "NOTION_TOKEN is present."

      - name: Run Notion backup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion-backup.mjs

      - name: Commit and push backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notion-backups/
          git diff --staged --quiet || git commit -m "chore: weekly Notion backup $(date -u +%F)"
          git push
