name: Auto-Content Optimizer
on:
  schedule:
    # Run at 7 AM UTC (after sync at 6 AM and Slack alerts)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger auto-optimizer Edge Function
        run: |
          curl -X POST ${{ secrets.SUPABASE_FUNCTION_URL }}/auto-content-optimizer \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Log execution
        run: echo "Auto-optimizer triggered at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
